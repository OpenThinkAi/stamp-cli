version: 2

# Dependabot keeps SHA-pinned actions, npm deps, and Docker base images
# current with annotated PRs. Without this, the security pins in
# publish.yml / ci.yml would silently rot to known-vulnerable versions.
updates:
  - package-ecosystem: github-actions
    # `directory: /` only scans .github/workflows/. The composite action
    # pins its own actions and must be listed explicitly, or its pins rot
    # unnoticed (AGT-2249).
    directories:
      - /
      - /.github/actions/verify-attestation
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-deps:
        dependency-type: development

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
