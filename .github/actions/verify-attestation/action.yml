name: stamp/verify-attestation
description: >
  Verify a stamp PR attestation on the current pull request. Computes the
  patch-id of the PR's base..head diff, fetches the corresponding
  refs/stamp/attestations/<patch-id> from origin, validates signature
  against .stamp/trusted-keys/ (sourced from the BASE ref) and checks
  the gate against .stamp/config.yml branch rules. Exit 0 if the
  attestation is valid for the PR's target branch; non-zero otherwise.
  GitHub branch protection consumes the exit code as the check status.

inputs:
  stamp-version:
    description: >
      Pin a specific @openthink/stamp release. Defaults to the version
      this Action ships with (the verifier is the trust anchor for the
      whole gate, so `latest` is intentionally NOT the default — a
      compromised future publish would silently affect every workflow
      using this Action). Override only when you've audited the
      replacement version. The default installs with `npm ci` from the
      lockfile in verifier/ (every transitive dependency pinned and
      hash-checked); any other value installs without a lockfile and
      emits a ::warning:: saying so ("latest" adds a second warning).
      Every install runs with --ignore-scripts. Bump the default in
      lockstep with verifier/package.json + package-lock.json.
    required: false
    default: "1.11.0"
  node-version:
    description: Node.js version to install. stamp-cli requires >= 22.12.0.
    required: false
    default: "22"
  target-branch:
    description: >
      Override the target branch the verifier checks against. Defaults
      to the PR's base ref (github.event.pull_request.base.ref).
      Useful when the verifier runs on push to a non-main branch and
      you want to enforce main's rule explicitly.
    required: false

runs:
  using: composite
  steps:
    - name: Resolve PR head + base SHAs
      id: refs
      shell: bash
      # Event fields reach bash through env:, never through ${{ }}
      # interpolation inside run: — an interpolated value is spliced into
      # the script text before bash parses it, so a crafted field (a
      # branch name is attacker-chosen on fork PRs) would become code.
      env:
        TARGET_BRANCH_OVERRIDE: ${{ inputs.target-branch }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        set -euo pipefail
        # PR events expose head + base SHAs directly. For non-PR events
        # (workflow_dispatch testing, etc.), GitHub doesn't fill these
        # in — fail loudly so the operator sees the misconfig rather
        # than verifying against the wrong refs.
        if [ -z "$HEAD_SHA" ] || [ -z "$BASE_SHA" ] || [ -z "$BASE_REF" ]; then
          echo "::error::stamp/verify-attestation requires a pull_request event (got '$EVENT_NAME'). Add 'on: pull_request' to the workflow."
          exit 2
        fi
        TARGET="${TARGET_BRANCH_OVERRIDE:-$BASE_REF}"
        # Every value is validated before it reaches $GITHUB_OUTPUT: a
        # newline in one (the caller-supplied target-branch input is the
        # realistic source) would otherwise inject extra output keys. The
        # values are deliberately not echoed in the errors.
        if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ && "$BASE_SHA" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]]; then
          echo "::error::stamp/verify-attestation: the PR head/base SHAs are not hex commit ids."
          exit 2
        fi
        if ! [[ "$TARGET" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || [[ "$TARGET" == *..* ]]; then
          echo "::error::stamp/verify-attestation: target-branch must be a plain branch name ([A-Za-z0-9._/-], no '..')."
          exit 2
        fi
        {
          echo "head=$HEAD_SHA"
          echo "base=$BASE_SHA"
          echo "target=$TARGET"
        } >> "$GITHUB_OUTPUT"

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install stamp-cli
      shell: bash
      env:
        STAMP_VERSION: ${{ inputs.stamp-version }}
      run: |
        set -euo pipefail
        # The verifier is the trust anchor for the whole gate, so its
        # install is locked down two ways:
        #
        #  1. --ignore-scripts: no lifecycle script from stamp or any
        #     transitive dependency runs in the job that verifies the
        #     attestation. stamp needs none (it is plain JS).
        #  2. The default version installs with `npm ci` from the lockfile
        #     committed beside this action (verifier/package-lock.json),
        #     so every transitive dependency is pinned to an exact version
        #     and checked against its integrity hash. A global install
        #     would ignore stamp's own lockfile and float every
        #     transitive to the newest version its semver range allows.
        #
        # The verifier lands in $RUNNER_TEMP, not the global prefix, and
        # its bin dir is put on PATH for the verify step.
        LOCK_DIR="$GITHUB_ACTION_PATH/verifier"
        LOCKED_VERSION="$(node -p 'require(process.argv[1]).dependencies["@openthink/stamp"]' "$LOCK_DIR/package.json")"
        PREFIX="$RUNNER_TEMP/stamp-verifier"
        rm -rf "$PREFIX"
        mkdir -p "$PREFIX"
        # Collapsed log group: npm's install chatter is setup noise —
        # the verification verdict below is what operators read.
        if [ "$STAMP_VERSION" = "$LOCKED_VERSION" ]; then
          cp "$LOCK_DIR/package.json" "$LOCK_DIR/package-lock.json" "$PREFIX/"
          echo "::group::npm ci --ignore-scripts (@openthink/stamp@${STAMP_VERSION}, lockfile-pinned)"
          npm ci --ignore-scripts --no-audit --no-fund --prefix "$PREFIX"
          echo "::endgroup::"
        else
          if [ "$STAMP_VERSION" = "latest" ]; then
            # `latest` floats to whatever was published most recently.
            # A compromised publish on `latest` would silently affect
            # every workflow using this Action. Surface the floating-
            # version choice in CI logs so operators see it.
            echo "::warning::stamp/verify-attestation is installing stamp@latest. Pin stamp-version in production."
          fi
          # Only the default version has a committed lockfile. An
          # overridden version still installs without scripts, but its
          # transitive dependencies resolve at CI time — say so.
          echo "::warning::stamp-version ${STAMP_VERSION} is not the lockfile-pinned verifier (${LOCKED_VERSION}); its transitive dependencies are not locked."
          echo '{"private":true}' > "$PREFIX/package.json"
          echo "::group::npm install --ignore-scripts @openthink/stamp@${STAMP_VERSION}"
          npm install --ignore-scripts --no-audit --no-fund --prefix "$PREFIX" "@openthink/stamp@${STAMP_VERSION}"
          echo "::endgroup::"
        fi
        echo "$PREFIX/node_modules/.bin" >> "$GITHUB_PATH"

    - name: Fetch attestation refs
      shell: bash
      run: |
        set -euo pipefail
        # The caller workflow MUST use actions/checkout with
        # fetch-depth: 0 (the renderVerifyWorkflow template does this
        # by default). That single-step checkout fetches base + head +
        # full ancestry, which is what `git merge-base` needs to
        # compute patch-id of base..head inside `stamp verify-pr`.
        #
        # The attestation refs (refs/stamp/attestations/*) aren't part
        # of git's default refspec, so the operator's actions/checkout
        # doesn't pull them — they need an explicit second fetch.
        # That's the ONLY thing this step does.
        #
        # We deliberately do NOT re-fetch the BASE_SHA / HEAD_SHA
        # commits here. An earlier iteration of this action did, with
        # `git fetch --depth=1 origin <base> <head>` — that flag
        # converts the previously-deep repo into a shallow clone for
        # those refs, severs the ancestry, and breaks merge-base. The
        # symptom was a confusing "git merge-base failed" exit from
        # the verifier even though both commits were present locally.
        # Collapsed log group: the per-ref fetch lines are setup noise
        # (one line per attestation ref in the repo's history).
        echo "::group::git fetch refs/stamp/attestations/*"
        git fetch origin "+refs/stamp/attestations/*:refs/stamp/attestations/*"
        echo "::endgroup::"

    - name: Verify attestation
      shell: bash
      env:
        HEAD_SHA: ${{ steps.refs.outputs.head }}
        BASE_SHA: ${{ steps.refs.outputs.base }}
        TARGET: ${{ steps.refs.outputs.target }}
      run: stamp verify-pr "$HEAD_SHA" --base "$BASE_SHA" --into "$TARGET"
